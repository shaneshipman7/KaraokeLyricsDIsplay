<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Lyric Display</title>
    <style>
        :root { --accent: #0070f3; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f12;
            color: #eee;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
        }
        .container {
            display: grid;
            grid-template-columns: 420px 1fr;
            height: 100vh;
        }
        
        .sidebar {
            background: #1a1a1f;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
            height: 100vh;
            box-sizing: border-box;
            position: relative;
        }

        .main {
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .karaoke-screen {
            flex: 1;
            background: radial-gradient(circle at center, #1f1f2b, #0a0a0f);
            padding: 20px 30px;
            overflow: hidden;
            position: relative;
        }
        
        .lyrics-wrapper {
            width: 100%;
            max-width: 920px;
            height: 100%;
            margin: 0 auto;
            overflow-y: auto;
            padding: 80px 40px 160px 40px;
            box-sizing: border-box;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .lyrics-wrapper::-webkit-scrollbar { display: none; }

        .lyrics-container {
            text-align: center;
            font-size: 29px;
            line-height: 1.5;
        }
        .line {
            margin: 20px 0;
            padding: 8px 0;
            opacity: 0.5;
            transition: all 0.3s ease;
            min-height: 1.5em;
        }
        .line.current {
            opacity: 1;
            font-size: 38px;
            color: white;
            text-shadow: 0 0 30px var(--accent);
            transform: scale(1.05);
        }
        .word {
            display: inline-block;
            padding: 3px 8px;
            margin: 2px 4px;
            border-radius: 6px;
            transition: all 0.1s linear;
        }
        .line.sync-target {
            outline: 2px dashed #ffaa00;
            outline-offset: 4px;
            opacity: 0.9;
            background: rgba(255, 170, 0, 0.08);
        }
        .line.synced {
            border-left: 3px solid #00ff9d;
        }
        
        .main-controls {
            padding: 15px 25px;
            background: #1a1a1f;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .offset-wrapper {
            margin-left: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .offset-wrapper input {
            width: 80px;
            margin: 0;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0051a8; }
        .secondary { background: #444; }
        .secondary:hover { background: #555; }
        input { padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; width: 100%; box-sizing: border-box; }

        .suggestions-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            max-height: 320px;
            overflow-y: auto;
            z-index: 1000;
            margin-top: 4px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: #0070f3; }
        .suggestion-item .song-title { font-weight: 600; }
        .suggestion-item .artist-name { font-size: 13px; color: #aaa; }

        .title-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 28px;
            border-radius: 30px;
            font-size: 19px;
            font-weight: bold;
            z-index: 10;
        }

        #statusMessage {
            margin-top: 15px;
            font-size: 14px;
            min-height: 24px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>🎤 Karaoke Setup</h2>
        <div class="form-group" style="position:relative; margin-bottom:20px;">
            <label><strong>Search Song or Artist</strong></label>
            <input type="text" id="searchQuery" placeholder="Type song title or artist..." autocomplete="off">
            <div id="suggestionsBox" class="suggestions-dropdown" style="display: none;"></div>
        </div>
        <input type="hidden" id="artist">
        <input type="hidden" id="title">
        <button id="generateBtn" style="width:100%; margin:15px 0;">Fetch Lyrics</button>
        
        <label>Audio Source (Optional)</label>
        <input type="file" id="audioUpload" accept="audio/*" style="margin:8px 0;">
        <input type="text" id="audioUrl" placeholder="Or paste mp3 URL" style="margin-bottom:12px;">
        
        <div style="margin:15px 0;">
            <label style="font-size: 14px; color: #aaa; cursor: pointer;">
                <input type="checkbox" id="lyricsOnly"> 
                <strong>Lyrics Only Mode</strong> (no backtrack)
            </label>
        </div>

        <div id="statusMessage"></div>
    </div>

    <div class="main">
        <div class="title-bar" id="songInfo">Select a song to begin</div>
        
        <div class="karaoke-screen" id="karaokeScreen">
            <div class="lyrics-wrapper" id="lyricsWrapper">
                <div class="lyrics-container" id="lyricsContainer"></div>
            </div>
        </div>
        
        <div class="main-controls">
            <div class="control-group">
                <button id="playBtn">▶ Play</button>
                <button id="pauseBtn" class="secondary">⏸ Pause</button>
                <button id="resetBtn" class="secondary">Reset</button>
                <button id="syncBtn" class="secondary">🎯 Sync Timing</button>
                <button id="exportBtn" class="secondary">💾 Export LRC</button>
                <button id="clearOverridesBtn" class="secondary">🗑️ Clear Saved</button>
                <button id="copyBtn" class="secondary">Copy Lyrics</button>
                <button id="fullScreenBtn">⛶ Full Screen</button>
            </div>
        </div>
    </div>
</div>

<script>

</script>
</body>
</html>
