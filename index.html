<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Lyric Display</title>
    <style>
        :root { --accent: #0070f3; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f12;
            color: #eee;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
        }
        .container {
            display: grid;
            grid-template-columns: 420px 1fr;
            height: 100vh;
        }
        
        .sidebar {
            background: #1a1a1f;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
            height: 100vh;
            box-sizing: border-box;
            position: relative;
        }

        .main {
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .karaoke-screen {
            flex: 1;
            background: radial-gradient(circle at center, #1f1f2b, #0a0a0f);
            padding: 20px 30px;
            overflow: hidden;
            position: relative;
        }
        
        .lyrics-wrapper {
            width: 100%;
            max-width: 920px;
            height: 100%;
            margin: 0 auto;
            overflow-y: auto;
            padding: 80px 40px 160px 40px;
            box-sizing: border-box;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .lyrics-wrapper::-webkit-scrollbar { display: none; }

        .lyrics-container {
            text-align: center;
            font-size: 29px;
            line-height: 1.5;
        }
        .line {
            margin: 20px 0;
            padding: 8px 0;
            opacity: 0.5;
            transition: all 0.3s ease;
            min-height: 1.5em;
        }
        .line.current {
            opacity: 1;
            font-size: 38px;
            color: white;
            text-shadow: 0 0 30px var(--accent);
            transform: scale(1.05);
        }
        .word {
            display: inline-block;
            padding: 3px 8px;
            margin: 2px 4px;
            border-radius: 6px;
            transition: all 0.1s linear;
        }
        .line.sync-target {
            outline: 2px dashed #ffaa00;
            outline-offset: 4px;
            opacity: 0.9;
            background: rgba(255, 170, 0, 0.08);
        }
        .line.synced {
            border-left: 3px solid #00ff9d;
        }
        
        .main-controls {
            padding: 15px 25px;
            background: #1a1a1f;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .offset-wrapper {
            margin-left: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .offset-wrapper input {
            width: 80px;
            margin: 0;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0051a8; }
        .secondary { background: #444; }
        .secondary:hover { background: #555; }
        input { padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; width: 100%; box-sizing: border-box; }

        .suggestions-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            max-height: 320px;
            overflow-y: auto;
            z-index: 1000;
            margin-top: 4px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: #0070f3; }
        .suggestion-item .song-title { font-weight: 600; }
        .suggestion-item .artist-name { font-size: 13px; color: #aaa; }
        .suggestion-item .lyric-snippet {
            font-size: 12px;
            color: #bbb;
            margin-top: 6px;
            font-style: italic;
            line-height: 1.3;
            max-height: 3.2em;
            overflow: hidden;
        }

        .title-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 28px;
            border-radius: 30px;
            font-size: 19px;
            font-weight: bold;
            z-index: 10;
        }

        #statusMessage {
            margin-top: 15px;
            font-size: 14px;
            min-height: 24px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>🎤 Karaoke Setup</h2>
        <div class="form-group" style="position:relative; margin-bottom:20px;">
            <label><strong>Search Song or Artist</strong></label>
            <input type="text" id="searchQuery" placeholder="Type song title or artist..." autocomplete="off">
            <div id="suggestionsBox" class="suggestions-dropdown" style="display: none;"></div>
        </div>
        <div class="form-group" style="position:relative; margin-bottom:20px;">
            <label><strong>Search by Lyrics</strong></label>
            <input type="text" id="lyricsSearchQuery" placeholder="Type a lyrics snippet..." autocomplete="off">
            <div id="lyricsSuggestionsBox" class="suggestions-dropdown" style="display: none;"></div>
        </div>
        <input type="hidden" id="artist">
        <input type="hidden" id="title">
        <button id="generateBtn" style="width:100%; margin:15px 0;">Fetch Lyrics</button>
        
        <label>Audio Source (Optional)</label>
        <input type="file" id="audioUpload" accept="audio/*" style="margin:8px 0;">
        <input type="text" id="audioUrl" placeholder="Or paste mp3 URL" style="margin-bottom:12px;">
        
        <div style="margin:15px 0;">
            <label style="font-size: 14px; color: #aaa; cursor: pointer;">
                <input type="checkbox" id="lyricsOnly"> 
                <strong>Lyrics Only Mode</strong> (no backtrack)
            </label>
        </div>

        <div id="statusMessage"></div>
    </div>

    <div class="main">
        <div class="title-bar" id="songInfo">Select a song to begin</div>
        
        <div class="karaoke-screen" id="karaokeScreen">
            <div class="lyrics-wrapper" id="lyricsWrapper">
                <div class="lyrics-container" id="lyricsContainer"></div>
            </div>
        </div>
        
        <div class="main-controls">
            <div class="control-group">
                <button id="playBtn">▶ Play</button>
                <button id="pauseBtn" class="secondary">⏸ Pause</button>
                <button id="resetBtn" class="secondary">Reset</button>
                <button id="syncBtn" class="secondary">🎯 Sync Timing</button>
                <div class="offset-wrapper">
                    <label>Timing Offset (ms):</label>
                    <input type="number" id="offset" value="0">
                </div>
            </div>
            
            <div class="control-group">
                <button id="exportBtn" class="secondary">💾 Export LRC</button>
                <button id="clearOverridesBtn" class="secondary">🗑️ Clear Saved</button>
                <button id="copyBtn" class="secondary">Copy Lyrics</button>
                <button id="fullScreenBtn">⛶ Full Screen</button>
            </div>
        </div>
    </div>
</div>

<script>
let autocompleteTimeout = null;
let currentSearchId = 0; 

const searchInput = document.getElementById("searchQuery");
const suggestionsBox = document.getElementById("suggestionsBox");

searchInput.addEventListener("focus", () => {
    if (searchInput.value.trim().length >= 2 && suggestionsBox.innerHTML.trim() !== "") {
        suggestionsBox.style.display = "block";
    }
});

searchInput.addEventListener("input", function(e) {
    const value = e.target.value.trim();
    clearTimeout(autocompleteTimeout);
    
    if (value.length < 2) {
        suggestionsBox.style.display = "none";
        return;
    }

    autocompleteTimeout = setTimeout(async () => {
        const searchId = Date.now();
        currentSearchId = searchId; 

        try {
            const res = await fetch("https://lrclib.net/api/search?q=" + encodeURIComponent(value));
            if (currentSearchId !== searchId) return; 

            if (res.ok) {
                const tracks = await res.json();
                if (tracks.length > 0) {
                    renderSuggestions(tracks, "lrclib");
                    return; 
                }
            }
        } catch (err) { console.warn("LRCLIB fetch failed", err); }

        try {
            const res = await fetch("https://api.lyrics.ovh/suggest/" + encodeURIComponent(value));
            if (currentSearchId !== searchId) return; 

            if (res.ok) {
                const payload = await res.json();
                if (payload.data && payload.data.length > 0) {
                    renderSuggestions(payload.data, "ovh");
                }
            }
        } catch (err) { console.warn("OVH fetch failed", err); }

    }, 300); 
});

// Lyrics search input
const lyricsSearchInput = document.getElementById("lyricsSearchQuery");
const lyricsSuggestionsBox = document.getElementById("lyricsSuggestionsBox");

lyricsSearchInput.addEventListener("focus", () => {
    if (lyricsSearchInput.value.trim().length >= 2 && lyricsSuggestionsBox.innerHTML.trim() !== "") {
        lyricsSuggestionsBox.style.display = "block";
    }
});

lyricsSearchInput.addEventListener("input", function(e) {
    const value = e.target.value.trim();
    clearTimeout(autocompleteTimeout);
    
    if (value.length < 2) {
        lyricsSuggestionsBox.style.display = "none";
        return;
    }

    autocompleteTimeout = setTimeout(async () => {
        const searchId = Date.now();
        currentSearchId = searchId; 

        try {
            const res = await fetch("https://api.audd.io/findLyrics/?q=" + encodeURIComponent(value) + "&api_token=test");
            if (currentSearchId !== searchId) return; 

            if (res.ok) {
                const data = await res.json();
                if (data.status === "success" && data.result && data.result.length > 0) {
                    renderLyricsSuggestions(data.result);
                    return;
                }
            }
        } catch (err) { console.warn("AudD lyrics search failed", err); }
        lyricsSuggestionsBox.style.display = "none";

    }, 300); 
});

function getMatchingSnippet(lyrics, query) {
    if (!lyrics || !query) return "";
    const q = query.toLowerCase().trim();
    const lines = lyrics.split(/\n+/).map(l => l.trim()).filter(l => l && !l.startsWith("["));
    let best = "";
    let bestScore = 0;
    for (const line of lines) {
        const lower = line.toLowerCase();
        if (lower.includes(q)) {
            // Prefer shorter lines that contain the exact query
            const score = 100 - Math.abs(line.length - q.length);
            if (score > bestScore) {
                bestScore = score;
                best = line;
            }
        }
    }
    if (best) return best.length > 120 ? best.slice(0, 117) + "…" : best;
    // Fallback: first non-empty line or truncated lyrics
    const fallback = lines.find(l => l.length > 10) || lyrics.slice(0, 80);
    return fallback.length > 100 ? fallback.slice(0, 97) + "…" : fallback;
}

function renderLyricsSuggestions(tracks) {
    lyricsSuggestionsBox.innerHTML = "";
    if (!tracks || tracks.length === 0) {
        lyricsSuggestionsBox.style.display = "none";
        return;
    }

    const query = lyricsSearchInput.value.trim();
    const displayTracks = tracks.slice(0, 8);
    displayTracks.forEach(track => {
        const item = document.createElement("div");
        item.className = "suggestion-item";
        const title = track.title || "Unknown";
        const artist = track.artist || "Unknown";
        const snippet = getMatchingSnippet(track.lyrics || "", query);
        
        item.innerHTML = `
            <div class="song-title">${title}</div>
            <div class="artist-name">by ${artist}</div>
            ${snippet ? `<div class="lyric-snippet">“${snippet}”</div>` : ""}
        `;
        
        item.addEventListener("click", () => {
            document.getElementById("searchQuery").value = `${title} - ${artist}`;
            document.getElementById("title").value = title;
            document.getElementById("artist").value = artist;
            lyricsSuggestionsBox.style.display = "none";
            // Prefer the lyrics that matched the search
            if (track.lyrics) {
                window.__preloadedLyrics = track.lyrics;
            } else {
                window.__preloadedLyrics = null;
            }
            document.getElementById("generateBtn").click();
        });
        lyricsSuggestionsBox.appendChild(item);
    });
    lyricsSuggestionsBox.style.display = "block";
}

function setupWordClickHandlers() {
    document.querySelectorAll('.word').forEach(wordEl => {
        wordEl.style.cursor = 'pointer'; // visual feedback
        
        wordEl.addEventListener('click', (e) => {
            e.stopPropagation();
            if (syncMode) return; // let line handler deal with it, or ignore
            
            const lineIndex = parseInt(wordEl.dataset.line);
            const wordIndex = parseInt(wordEl.dataset.word);
            const lineData = currentLyrics[lineIndex];
            
            if (!lineData) return;
            
            // Calculate approximate timestamp for this word
            const lineStartMs = lineData.time;
            const nextLineStartMs = (lineIndex + 1 < currentLyrics.length) 
                ? currentLyrics[lineIndex + 1].time 
                : lineStartMs + 4000;
            
            const lineDurationMs = nextLineStartMs - lineStartMs;
            const wordDurationMs = lineDurationMs / Math.max(1, lineData.words.length);
            const wordStartMs = lineStartMs + (wordIndex * wordDurationMs);
            const targetMs = Math.max(0, wordStartMs - 200);
            
            seekTo(targetMs);
            statusMessage.textContent = `⏩ Jumped to "${wordEl.textContent}"`;
            setTimeout(() => statusMessage.textContent = "", 1200);
        });
    });
}
function renderSuggestions(tracks, source) {
    suggestionsBox.innerHTML = "";
    if (!tracks || tracks.length === 0) {
        suggestionsBox.style.display = "none";
        return;
    }

    const displayTracks = tracks.slice(0, 8);
    displayTracks.forEach(track => {
        const item = document.createElement("div");
        item.className = "suggestion-item";
        let title, artist;
        if (source === "ovh") {
            title = track.title;
            artist = track.artist.name;
        } else if (source === "audd") {
            title = track.title;
            artist = track.artist;
        } else {
            title = track.name;
            artist = track.artistName;
        }
        
        item.innerHTML = `<div class="song-title">${title}</div><div class="artist-name">by ${artist}</div>`;
        
        item.addEventListener("click", () => {
            document.getElementById("searchQuery").value = `${title} - ${artist}`;
            document.getElementById("title").value = title;
            document.getElementById("artist").value = artist;
            suggestionsBox.style.display = "none";
            document.getElementById("generateBtn").click(); 
        });
        suggestionsBox.appendChild(item);
    });
    suggestionsBox.style.display = "block";
}

document.addEventListener("click", (e) => {
    if (!e.target.closest("#searchQuery") && !e.target.closest("#suggestionsBox")) {
        suggestionsBox.style.display = "none";
    }
    if (!e.target.closest("#lyricsSearchQuery") && !e.target.closest("#lyricsSuggestionsBox")) {
        lyricsSuggestionsBox.style.display = "none";
    }
});

// ==================== CORE VARIABLES ====================
let currentLyrics = [];
let audio = null;
let isPlaying = false;
let animationFrame = null;
let offsetMs = 0;
let timerStart = 0;
let syncMode = false;
let nextSyncIndex = 0;
let currentSongKey = null;
let lastScrolledIndex = -1;
let autoScrollEnabled = true;
let autoScrollTimeout = null;

// Pause auto-scroll briefly when user manually interacts with the lyrics
function pauseAutoScroll() {
    autoScrollEnabled = false;
    clearTimeout(autoScrollTimeout);
    autoScrollTimeout = setTimeout(() => {
        autoScrollEnabled = true;
        lastScrolledIndex = -1; // re-center on next update
    }, 5000);
}

const lyricsWrapperEl = document.getElementById("lyricsWrapper");
if (lyricsWrapperEl) {
    lyricsWrapperEl.addEventListener("wheel", pauseAutoScroll, { passive: true });
    lyricsWrapperEl.addEventListener("touchstart", pauseAutoScroll, { passive: true });
    lyricsWrapperEl.addEventListener("mousedown", pauseAutoScroll);
}


// ==================== LRC PARSER & FETCH ====================
function parseLRC(lrcText) {
    if (!lrcText) return [];
    const lines = lrcText.split('\n');
    const parsed = [];
    let hasTimestamps = false;
    lines.forEach(line => {
        const timeMatches = [...line.matchAll(/\[(\d+):(\d+)(?:\.(\d+))?\]/g)];
        if (timeMatches.length > 0) hasTimestamps = true;
        if (timeMatches.length === 0) return;
        let text = line.replace(/\[\d+:\d+(?:\.\d+)?\]/g, '').trim();
        if (!text) return;
        timeMatches.forEach(match => {
            const min = parseInt(match[1]);
            const sec = parseInt(match[2]);
            const ms = match[3] ? parseInt(match[3].padEnd(3, '0')) : 0;
            const timeMs = (min * 60 + sec) * 1000 + ms;
            parsed.push({
                time: timeMs,
                text: text,
                words: text.split(/\s+/).filter(w => w.length > 0)
            });
        });
    });
    if (hasTimestamps && parsed.length > 0) {
        return parsed.sort((a, b) => a.time - b.time);
    }
    // Fallback for plain text lyrics (e.g. from AudD lyrics search)
    const plainLines = lrcText.split(/\n+/).map(l => l.trim()).filter(l => l && !l.startsWith("[") && l.length > 1);
    return plainLines.map((text, i) => ({
        time: i * 4000, // dummy spacing so lines are distinct
        text: text,
        words: text.split(/\s+/).filter(w => w.length > 0)
    }));
}

async function fetchLyrics(artist, title) {
    const status = document.getElementById("statusMessage");
    status.textContent = "🔍 Searching lyrics...";
    try {
        const res = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}`);
        if (res.ok) {
            const data = await res.json();
            if (data.syncedLyrics) {
                status.textContent = "✅ Synced lyrics loaded!";
                return data.syncedLyrics;
            }
        }
    } catch(e) {}
    try {
        const res = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`);
        if (res.ok) {
            const data = await res.json();
            status.textContent = "Loaded basic lyrics";
            return data.lyrics || "";
        }
    } catch(e) {}
    status.textContent = "⚠️ Lyrics not found";
    return null;
}

function getSongKey(artist, title) {
    return `karaoke_timing_${(artist || "").trim().toLowerCase()}|${(title || "").trim().toLowerCase()}`;
}

function saveTimings() {
    if (!currentSongKey || !currentLyrics.length) return;
    const times = currentLyrics.map(l => l.time);
    localStorage.setItem(currentSongKey, JSON.stringify(times));
}

function loadTimings() {
    if (!currentSongKey) return false;
    const saved = localStorage.getItem(currentSongKey);
    if (!saved) return false;
    try {
        const times = JSON.parse(saved);
        if (times.length === currentLyrics.length) {
            currentLyrics.forEach((line, i) => {
                if (typeof times[i] === "number") line.time = times[i];
            });
            return true;
        }
    } catch (e) {}
    return false;
}

function generateLRC() {
    if (!currentLyrics.length) return "";
    return currentLyrics.map(line => {
        const totalMs = Math.max(0, line.time);
        const min = Math.floor(totalMs / 60000);
        const sec = Math.floor((totalMs % 60000) / 1000);
        const ms = Math.floor(totalMs % 1000);
        return `[${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}.${String(ms).padStart(3,"0")}]${line.text}`;
    }).join("\n");
}

function renderLyrics(lyricsText) {
    currentLyrics = parseLRC(lyricsText);
    const artist = document.getElementById("artist").value.trim();
    const title = document.getElementById("title").value.trim();
    currentSongKey = getSongKey(artist, title);
    const hadOverrides = loadTimings();
    
    const container = document.getElementById("lyricsContainer");
    container.innerHTML = "";
    
    currentLyrics.forEach((line, lineIndex) => {
        const div = document.createElement("div");
        div.className = "line" + (hadOverrides ? " synced" : "");
        div.dataset.index = lineIndex;
        
        div.innerHTML = line.words.map((word, wordIndex) => {
            return `<span class="word" data-line="${lineIndex}" data-word="${wordIndex}">${word}</span>`;
        }).join(' ');
        
        div.addEventListener("click", (e) => {
            e.stopPropagation();
            if (syncMode) {
                const currentMs = getCurrentMs();
                currentLyrics[lineIndex].time = Math.max(0, Math.round(currentMs));
                div.classList.add("synced");
                nextSyncIndex = lineIndex + 1;
                updateSyncTarget();
                saveTimings();
                statusMessage.textContent = `✅ Line ${lineIndex + 1} timed at ${(currentMs/1000).toFixed(2)}s`;
                setTimeout(() => statusMessage.textContent = "", 1200);
            } else {
                // Normal mode: seek to this line
                const targetMs = Math.max(0, currentLyrics[lineIndex].time);
                seekTo(targetMs);
                statusMessage.textContent = `⏩ Jumped to line ${lineIndex + 1}`;
                setTimeout(() => statusMessage.textContent = "", 1200);
            }
        });
        
        container.appendChild(div);
    });

    setupWordClickHandlers();
    if (hadOverrides) {
        statusMessage.textContent = "📂 Loaded saved timing overrides";
        setTimeout(() => statusMessage.textContent = "", 2000);
    }
}

function getCurrentMs() {
    if (audio && !isNaN(audio.currentTime)) {
        return (audio.currentTime * 1000) + offsetMs;
    }
    return (Date.now() - timerStart) + offsetMs;
}

function seekTo(ms) {
    const target = Math.max(0, ms);
    if (audio) {
        audio.currentTime = target / 1000;
    } else {
        timerStart = Date.now() - target;
    }
    updateLyricsDisplay();
}

function updateLyricsDisplay() {
    const currentMs = getCurrentMs();
    let currentIndex = -1;
    for (let i = 0; i < currentLyrics.length; i++) {
        if (currentLyrics[i].time <= currentMs) currentIndex = i;
        else break;
    }
    document.querySelectorAll(".line").forEach((el, i) => {
        el.classList.toggle("current", i === currentIndex);
    });
    if (currentIndex >= 0 && currentIndex !== lastScrolledIndex && autoScrollEnabled) {
        const el = document.querySelector(`.line[data-index="${currentIndex}"]`);
        if (el) {
            el.scrollIntoView({ behavior: "smooth", block: "center" });
            lastScrolledIndex = currentIndex;
        }
    }
}

function updateSyncTarget() {
    document.querySelectorAll(".line").forEach(el => el.classList.remove("sync-target"));
    if (syncMode && nextSyncIndex < currentLyrics.length) {
        const el = document.querySelector(`.line[data-index="${nextSyncIndex}"]`);
        if (el) el.classList.add("sync-target");
    }
}

// ==================== EVENT LISTENERS ====================
document.getElementById("generateBtn").addEventListener("click", async () => {
    const artist = document.getElementById("artist").value.trim();
    const title = document.getElementById("title").value.trim();
    if (!title) {
        statusMessage.textContent = "Please search for a song first";
        return;
    }
    let lyrics = window.__preloadedLyrics || null;
    window.__preloadedLyrics = null; // consume it
    if (!lyrics) {
        lyrics = await fetchLyrics(artist, title);
    } else {
        statusMessage.textContent = "✅ Using matching lyrics from search";
    }
    if (lyrics) {
        document.getElementById("songInfo").textContent = `${title} — ${artist || "Unknown"}`;
        renderLyrics(lyrics);
        setTimeout(() => {
            document.getElementById("lyricsWrapper").scrollTo({ top: 0, behavior: "auto" });
        }, 100);
    }
});

document.getElementById("playBtn").addEventListener("click", () => {
    if (currentLyrics.length === 0) {
        statusMessage.textContent = "Load lyrics first";
        return;
    }
    const lyricsOnly = document.getElementById("lyricsOnly").checked;
    const audioFile = document.getElementById("audioUpload").files[0];
    const audioUrl = document.getElementById("audioUrl").value.trim();
    
    if (!lyricsOnly && (audioFile || audioUrl)) {
        if (audio) audio.pause();
        audio = new Audio(audioFile ? URL.createObjectURL(audioFile) : audioUrl);
        audio.play().catch(e => console.error(e));
        isPlaying = true;
        animationFrame = requestAnimationFrame(function loop() {
            if (isPlaying) {
                updateLyricsDisplay();
                animationFrame = requestAnimationFrame(loop);
            }
        });
    } else {
        // Lyrics only / timer mode
        isPlaying = true;
        timerStart = Date.now() - (getCurrentMs() - offsetMs);
        animationFrame = requestAnimationFrame(function loop() {
            if (isPlaying) {
                updateLyricsDisplay();
                animationFrame = requestAnimationFrame(loop);
            }
        });
    }
});

document.getElementById("pauseBtn").addEventListener("click", () => {
    isPlaying = false;
    if (audio) audio.pause();
    cancelAnimationFrame(animationFrame);
});

document.getElementById("resetBtn").addEventListener("click", () => {
    isPlaying = false;
    if (audio) {
        audio.pause();
        audio.currentTime = 0;
    }
    timerStart = Date.now();
    offsetMs = parseInt(document.getElementById("offset").value) || 0;
    cancelAnimationFrame(animationFrame);
    document.getElementById("lyricsWrapper").scrollTo({ top: 0, behavior: "smooth" });
    updateLyricsDisplay();
});

document.getElementById("offset").addEventListener("input", (e) => {
    offsetMs = parseInt(e.target.value) || 0;
});

document.getElementById("syncBtn").addEventListener("click", () => {
    syncMode = !syncMode;
    nextSyncIndex = 0;
    document.getElementById("syncBtn").textContent = syncMode ? "✅ Syncing (click lines)" : "🎯 Sync Timing";
    updateSyncTarget();
    statusMessage.textContent = syncMode ? "Sync mode: click each line as it is sung" : "Sync mode off";
    setTimeout(() => statusMessage.textContent = "", 2000);
});

document.getElementById("exportBtn").addEventListener("click", () => {
    const lrc = generateLRC();
    if (!lrc) return;
    const blob = new Blob([lrc], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (document.getElementById("title").value || "lyrics") + ".lrc";
    a.click();
});

document.getElementById("clearOverridesBtn").addEventListener("click", () => {
    if (currentSongKey) localStorage.removeItem(currentSongKey);
    statusMessage.textContent = "Cleared saved timings for this song";
    setTimeout(() => statusMessage.textContent = "", 1500);
});

document.getElementById("copyBtn").addEventListener("click", () => {
    if (currentLyrics.length === 0) return;
    const text = currentLyrics.map(l => l.text).join('\n');
    navigator.clipboard.writeText(text);
    statusMessage.textContent = "Lyrics copied!";
    setTimeout(() => statusMessage.textContent = "", 1200);
});

document.getElementById("fullScreenBtn").addEventListener("click", () => {
    document.getElementById("karaokeScreen").requestFullscreen();
});
</script>
</body>
</html>
