<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Lyric Display</title>
    <style>
        :root { --accent: #0070f3; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f12;
            color: #eee;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
        }
        .container {
            display: grid;
            grid-template-columns: 420px 1fr;
            height: 100vh;
        }
        
        .sidebar {
            background: #1a1a1f;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #333;
            height: 100vh;
            box-sizing: border-box;
            position: relative;
        }

        .main {
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .karaoke-screen {
            flex: 1;
            background: radial-gradient(circle at center, #1f1f2b, #0a0a0f);
            padding: 20px 30px;
            overflow: hidden;
            position: relative;
        }
        
        .lyrics-wrapper {
            width: 100%;
            max-width: 920px;
            height: 100%;
            margin: 0 auto;
            overflow-y: auto;
            padding: 80px 40px 160px 40px;
            box-sizing: border-box;
            scroll-behavior: smooth;
            
            /* --- MAGIC SCROLLBAR HIDING --- */
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .lyrics-wrapper::-webkit-scrollbar {
            display: none;
        }
        /* ------------------------------ */

        .lyrics-container {
            text-align: center;
            font-size: 29px;
            line-height: 1.5;
        }
        .line {
            margin: 20px 0;
            padding: 8px 0;
            opacity: 0.5;
            transition: all 0.3s ease;
            min-height: 1.5em;
        }
        .line.current {
            opacity: 1;
            font-size: 38px;
            color: white;
            text-shadow: 0 0 30px var(--accent);
            transform: scale(1.05);
        }
        .word {
            display: inline-block;
            padding: 3px 8px;
            margin: 2px 4px;
            border-radius: 6px;
            transition: all 0.1s linear;
        }
        .word.active {
            background: #00ff9d;
            color: #000;
            font-weight: bold;
            transform: scale(1.08);
        }
        
        .main-controls {
            padding: 15px 25px;
            background: #1a1a1f;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .offset-wrapper {
            margin-left: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .offset-wrapper input {
            width: 80px;
            margin: 0;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0051a8; }
        .secondary { background: #444; }
        .secondary:hover { background: #555; }
        input { padding: 10px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; width: 100%; box-sizing: border-box; }

        .suggestions-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            max-height: 320px;
            overflow-y: auto;
            z-index: 1000;
            margin-top: 4px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: #0070f3; }
        .suggestion-item .song-title { font-weight: 600; }
        .suggestion-item .artist-name { font-size: 13px; color: #aaa; }

        .title-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 28px;
            border-radius: 30px;
            font-size: 19px;
            font-weight: bold;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>🎤 Karaoke Setup</h2>
        <div class="form-group" style="position:relative; margin-bottom:20px;">
            <label><strong>Search Song or Artist</strong></label>
            <input type="text" id="searchQuery" placeholder="Type song title or artist..." autocomplete="off">
            <div id="suggestionsBox" class="suggestions-dropdown" style="display: none;"></div>
        </div>
        <input type="hidden" id="artist">
        <input type="hidden" id="title">
        <button id="generateBtn" style="width:100%; margin:15px 0;">Fetch Lyrics</button>
        
        <label>Audio Source</label>
        <input type="file" id="audioUpload" accept="audio/*" style="margin:8px 0;">
        <input type="text" id="audioUrl" placeholder="Or paste mp3 URL" style="margin-bottom:12px;">
        
        <div id="statusMessage" style="margin-top:15px; font-size:14px; min-height:24px; color: #888;"></div>
    </div>

    <div class="main">
        <div class="title-bar" id="songInfo">Select a song to begin</div>
        
        <div class="karaoke-screen" id="karaokeScreen">
            <div class="lyrics-wrapper" id="lyricsWrapper">
                <div class="lyrics-container" id="lyricsContainer"></div>
            </div>
        </div>
        
        <div class="main-controls">
            <div class="control-group">
                <button id="playBtn">▶ Play</button>
                <button id="pauseBtn" class="secondary">⏸ Pause</button>
                <button id="resetBtn" class="secondary">Reset</button>
                <div class="offset-wrapper">
                    <label>Timing Offset (ms):</label>
                    <input type="number" id="offset" value="0">
                </div>
            </div>
            
            <div class="control-group">
                <button id="copyBtn" class="secondary">Copy Lyrics</button>
                <button id="fullScreenBtn">⛶ Full Screen</button>
            </div>
        </div>
    </div>
</div>

<script>
let autocompleteTimeout = null;
let currentSearchId = 0; 

const searchInput = document.getElementById("searchQuery");
const suggestionsBox = document.getElementById("suggestionsBox");

searchInput.addEventListener("focus", () => {
    if (searchInput.value.trim().length >= 2 && suggestionsBox.innerHTML.trim() !== "") {
        suggestionsBox.style.display = "block";
    }
});

searchInput.addEventListener("input", function(e) {
    const value = e.target.value.trim();
    clearTimeout(autocompleteTimeout);
    
    if (value.length < 2) {
        suggestionsBox.style.display = "none";
        return;
    }

    autocompleteTimeout = setTimeout(async () => {
        const searchId = Date.now();
        currentSearchId = searchId; 

        try {
            const res = await fetch("https://lrclib.net/api/search?q=" + encodeURIComponent(value));
            if (currentSearchId !== searchId) return; 

            if (res.ok) {
                const tracks = await res.json();
                if (tracks.length > 0) {
                    renderSuggestions(tracks, "lrclib");
                    return; 
                }
            }
        } catch (err) { console.warn("LRCLIB fetch failed", err); }

        try {
            const res = await fetch("https://api.lyrics.ovh/suggest/" + encodeURIComponent(value));
            if (currentSearchId !== searchId) return; 

            if (res.ok) {
                const payload = await res.json();
                if (payload.data && payload.data.length > 0) {
                    renderSuggestions(payload.data, "ovh");
                }
            }
        } catch (err) { console.warn("OVH fetch failed", err); }

    }, 300); 
});

function renderSuggestions(tracks, source) {
    suggestionsBox.innerHTML = "";
    
    if (!tracks || tracks.length === 0) {
        suggestionsBox.style.display = "none";
        return;
    }

    const displayTracks = tracks.slice(0, 8);
    displayTracks.forEach(track => {
        const item = document.createElement("div");
        item.className = "suggestion-item";
        const title = source === "ovh" ? track.title : track.name;
        const artist = source === "ovh" ? track.artist.name : track.artistName;
        
        item.innerHTML = `<div class="song-title">${title}</div><div class="artist-name">by ${artist}</div>`;
        
        item.addEventListener("click", () => {
            document.getElementById("searchQuery").value = `${title} - ${artist}`;
            document.getElementById("title").value = title;
            document.getElementById("artist").value = artist;
            suggestionsBox.style.display = "none";
            document.getElementById("generateBtn").click(); 
        });
        suggestionsBox.appendChild(item);
    });
    suggestionsBox.style.display = "block";
}

document.addEventListener("click", (e) => {
    if (!e.target.closest("#searchQuery") && !e.target.closest("#suggestionsBox")) {
        suggestionsBox.style.display = "none";
    }
});


let currentLyrics = [];
let audio = null;
let isPlaying = false;
let animationFrame = null;
let offsetMs = 0;

function parseLRC(lrcText) {
    const lines = lrcText.split('\n');
    const parsed = [];
    lines.forEach(line => {
        const timeMatches = [...line.matchAll(/\[(\d+):(\d+)(?:\.(\d+))?\]/g)];
        if (timeMatches.length === 0) return;
        let text = line.replace(/\[\d+:\d+(?:\.\d+)?\]/g, '').trim();
        if (!text) return;
        timeMatches.forEach(match => {
            const min = parseInt(match[1]);
            const sec = parseInt(match[2]);
            const ms = match[3] ? parseInt(match[3].padEnd(3, '0')) : 0;
            const timeMs = (min * 60 + sec) * 1000 + ms;
            parsed.push({
                time: timeMs,
                text: text,
                words: text.split(/\s+/).filter(w => w.length > 0)
            });
        });
    });
    return parsed.sort((a, b) => a.time - b.time);
}

async function fetchLyrics(artist, title) {
    const status = document.getElementById("statusMessage");
    status.textContent = "🔍 Searching lyrics...";
    try {
        const res = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}`);
        if (res.ok) {
            const data = await res.json();
            if (data.syncedLyrics) {
                status.textContent = "✅ Synced lyrics loaded!";
                return data.syncedLyrics;
            }
        }
    } catch(e) {}
    try {
        const res = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`);
        if (res.ok) {
            const data = await res.json();
            status.textContent = "Loaded basic lyrics";
            return data.lyrics || "";
        }
    } catch(e) {}
    status.textContent = "⚠️ Lyrics not found";
    return null;
}

function renderLyrics(lyricsText) {
    currentLyrics = parseLRC(lyricsText);
    const container = document.getElementById("lyricsContainer");
    container.innerHTML = "";
    currentLyrics.forEach((line, i) => {
        const div = document.createElement("div");
        div.className = "line";
        div.dataset.index = i;
        div.innerHTML = line.words.map(word => `<span class="word">${word}</span>`).join(' ');
        container.appendChild(div);
    });
}

function updateLyrics(currentMs) {
    const lines = document.querySelectorAll('.line');
    let currentIndex = -1;

    lines.forEach((lineEl, i) => {
        const lineData = currentLyrics[i];
        if (!lineData) return;

        const isCurrent = currentMs >= lineData.time && 
                         (i === currentLyrics.length - 1 || currentMs < currentLyrics[i + 1].time);

        lineEl.classList.toggle('current', isCurrent);
        if (isCurrent) currentIndex = i;

        if (isCurrent) {
            const words = lineEl.querySelectorAll('.word');
            const progress = Math.max(0, (currentMs - lineData.time) / 600);
            words.forEach((wordEl, idx) => {
                wordEl.classList.toggle('active', idx <= Math.floor(progress));
            });
        } else {
            lineEl.querySelectorAll('.word').forEach(w => w.classList.remove('active'));
        }
    });

    if (currentIndex >= 3) {  
        const wrapper = document.getElementById("lyricsWrapper");
        const currentLine = lines[currentIndex];
        if (currentLine && wrapper) {
            currentLine.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }
    }
}

function tick() {
    if (!audio || !isPlaying) return;
    const currentMs = (audio.currentTime * 1000) + offsetMs;
    updateLyrics(currentMs);
    animationFrame = requestAnimationFrame(tick);
}

const audioUpload = document.getElementById("audioUpload");
const audioUrlInput = document.getElementById("audioUrl");

audioUpload.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) {
        if (audio) audio.pause();
        audio = new Audio(URL.createObjectURL(file));
        setupAudioEvents();
    }
});

function setupAudioEvents() {
    if (!audio) return;
    audio.onplay = () => { isPlaying = true; tick(); };
    audio.onpause = () => { isPlaying = false; cancelAnimationFrame(animationFrame); };
    audio.onended = () => { isPlaying = false; };
}

document.getElementById("playBtn").addEventListener("click", () => {
    if (!audio) {
        const url = audioUrlInput.value.trim();
        if (!url) {
            alert("Please upload an audio file or paste a direct mp3 URL");
            return;
        }
        audio = new Audio(url);
        setupAudioEvents();
    }
    audio.play().catch(err => {
        console.error(err);
        alert("Could not play audio. Make sure it's a direct .mp3 link.");
    });
});

document.getElementById("pauseBtn").addEventListener("click", () => {
    if (audio) audio.pause();
});

document.getElementById("resetBtn").addEventListener("click", () => {
    if (audio) {
        audio.currentTime = 0;
        offsetMs = parseInt(document.getElementById("offset").value) || 0;
        document.getElementById("lyricsWrapper").scrollTo({ top: 0, behavior: "smooth" });
    }
});

document.getElementById("offset").addEventListener("input", (e) => {
    offsetMs = parseInt(e.target.value) || 0;
});

document.getElementById("generateBtn").addEventListener("click", async () => {
    const artist = document.getElementById("artist").value.trim();
    const title = document.getElementById("title").value.trim();
   
    if (!title) {
        document.getElementById("statusMessage").textContent = "Search for a song first";
        return;
    }
    const lyrics = await fetchLyrics(artist, title);
    if (lyrics) {
        document.getElementById("songInfo").textContent = `${title} — ${artist || "Unknown"}`;
        renderLyrics(lyrics);
        setTimeout(() => {
            document.getElementById("lyricsWrapper").scrollTo({ top: 0, behavior: "auto" });
        }, 100);
    }
});

document.getElementById("fullScreenBtn").addEventListener("click", () => {
    document.getElementById("karaokeScreen").requestFullscreen();
});

document.getElementById("copyBtn").addEventListener("click", () => {
    if (currentLyrics.length === 0) return;
    const text = currentLyrics.map(l => l.text).join('\n');
    navigator.clipboard.writeText(text);
});
</script>
</body>
</html>
